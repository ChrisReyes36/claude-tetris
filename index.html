<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toolbar">
    <div class="skin-picker" role="group" aria-label="Skin">
      <button class="skin-btn" type="button" data-skin="retro" aria-pressed="true">Retro</button>
      <button class="skin-btn" type="button" data-skin="neon" aria-pressed="false">Neon</button>
      <button class="skin-btn" type="button" data-skin="pastel" aria-pressed="false">Pastel</button>
      <button class="skin-btn" type="button" data-skin="pixel" aria-pressed="false">Pixel</button>
    </div>
    <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">☀ Claro</button>
  </div>

  <div class="wrapper">
    <h1 class="title">TETRIS</h1>

    <div class="stage">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="name-form" class="name-form hidden" autocomplete="off">
          <label for="name-input" id="name-label">¡Nuevo récord! Escribe tu nombre</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="10" placeholder="ANÓNIMO" />
            <button id="save-btn" type="submit">Guardar</button>
          </div>
        </form>

        <div id="records" class="records hidden">
          <span class="label">MEJORES PUNTUACIONES</span>
          <ol id="records-list" class="records-list"></ol>
          <p id="records-stats" class="records-stats"></p>
          <button id="reset-records-btn" type="button">Resetear records</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title" class="pause-title">PAUSA</p>

        <div id="pause-main" class="pause-view">
          <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn" type="button">Reiniciar</button>
          <button id="controls-btn" class="menu-btn" type="button">Ver controles</button>
          <label class="level-select" for="start-level">
            <span>Nivel inicial</span>
            <select id="start-level"></select>
          </label>
          <p class="menu-hint">Se aplica a la próxima partida</p>
        </div>

        <div id="pause-controls" class="pause-view hidden">
          <ul class="controls-list">
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Space</kbd></span> caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa / reanudar</li>
          </ul>
          <button id="controls-back-btn" class="menu-btn" type="button">Volver</button>
        </div>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
